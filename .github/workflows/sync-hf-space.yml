name: Sync Gradio app to HF Space

# Runs on every push to main (not just when the app file itself changes):
# requirements.txt pins protac-splitter to this exact commit, so any change
# to the library needs a fresh Space build, not just changes to the app script.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PROTAC-Splitter
        uses: actions/checkout@v4

      - name: Push updated app to the HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN secret is not set. See README for setup instructions."
            exit 1
          fi

          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/ailab-bio/PROTAC-Splitter-App" space
          cp scripts/protac_splitter_app.py space/protac_splitter_app.py

          # Pin to this commit, not the floating "main" ref: HF Spaces cache the
          # build layer by requirements.txt content, so a static "@main" string
          # lets a stale (pre-update) resolution survive across rebuilds.
          sed "s|PROTAC-Splitter.git@main|PROTAC-Splitter.git@${GITHUB_SHA}|" \
            scripts/hf_space_requirements.txt > space/requirements.txt

          cd space
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add protac_splitter_app.py requirements.txt
          if git diff --cached --quiet; then
            echo "No changes to sync — Space is already up to date."
          else
            git commit -m "Sync app from ribesstefano/PROTAC-Splitter@${GITHUB_SHA}"
            git push
          fi
